name: 每日盤後真實市場數據更新排程

on:
  schedule:
    # 台灣時間 (UTC+8) 週一至週五 16:30 執行 (對應 UTC 08:30)
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 介面上手動一鍵執行

# 明確宣告賦予 GITHUB_TOKEN 寫入內容的權限
permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 3.11 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝量化依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas yfinance

      - name: 執行全市場 100% 真實數據整合腳本
        run: |
          python update_market.py

      - name: 提交並推送最新數據與籌碼滾動快取
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 檢查檔案是否存在，避免 git add 報錯中斷
          [ -f market_stocks.json ] && git add market_stocks.json
          [ -f chips_history.json ] && git add chips_history.json
          git diff --staged --quiet || (git commit -m "自動更新: 盤後全市場真實量價與籌碼歷史快取 [skip ci]" && git push)
